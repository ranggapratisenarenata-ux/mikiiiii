<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading Memories...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #0b070c;
            color: #ffb7c5;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* ----- SCREEN 1: LOADING ----- */
        #loading-screen {
            position: absolute;
            z-index: 10;
            text-align: center;
            transition: opacity 1s ease;
        }

        .heart {
            font-size: 40px;
            color: #ff4d6d;
            animation: pulse 1s infinite alternate;
            margin-bottom: 15px;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.7; }
            100% { transform: scale(1.2); opacity: 1; text-shadow: 0 0 15px #ff4d6d; }
        }

        .loading-text {
            font-size: 16px;
            letter-spacing: 3px;
            color: #e5989b;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .dots::after {
            content: '';
            animation: dots 1.5s infinite;
        }

        @keyframes dots {
            0% { content: '.'; }
            33% { content: '..'; }
            66% { content: '...'; }
        }

        /* ----- SCREEN 2: MEMORIES CONTAINER ----- */
        #main-screen {
            position: absolute;
            width: 100%;
            height: 100%;
            display: none;
            opacity: 0;
            transition: opacity 1.5s ease;
            overflow: hidden;
        }

        /* Floating background text and photos */
        .floating-item {
            position: absolute;
            color: rgba(255, 183, 197, 0.35);
            font-size: 14px;
            white-space: nowrap;
            animation: floatUp 10s linear infinite;
        }

        .photo-card {
            position: absolute;
            width: 90px;
            height: 90px;
            border-radius: 12px;
            border: 2px solid rgba(255, 183, 197, 0.4);
            object-fit: cover;
            animation: floatUp 12s linear infinite;
            box-shadow: 0 4px 15px rgba(255, 77, 109, 0.2);
        }

        @keyframes floatUp {
            0% {
                transform: translateY(105vh) scale(0.8);
                opacity: 0;
            }
            20% { opacity: 0.8; }
            80% { opacity: 0.8; }
            100% {
                transform: translateY(-20vh) scale(1);
                opacity: 0;
            }
        }

        /* Music control button */
        .music-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(255, 77, 109, 0.2);
            border: 1px solid #ff4d6d;
            color: #ffb7c5;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 100;
            font-size: 18px;
            backdrop-filter: blur(5px);
        }
    </style>
</head>
<body>

    <!-- Layar Loading Awal -->
    <div id="loading-screen">
        <div class="heart">❤️</div>
        <div class="loading-text">Loading Memories<span class="dots"></span></div>
    </div>

    <!-- Layar Utama Konten Kenangan -->
    <div id="main-screen">
        <!-- Elemen teks dan foto mengapung otomatis lewat Javascript -->
    </div>

    <!-- Audio Musik Latar (Opsional, ganti link src dengan lagu pilihan Anda) -->
    <audio id="bg-music" loop>
        <source src="Tuluss.mp4">
    </audio>

    <div class="music-btn" onclick="toggleMusic()" id="music-icon">🎵</div>

    <script>
        // Data teks romantis & foto yang akan melayang
        const texts = [
            "you mean everything", "only you", "always with you", 
            "stay with me", "my favorite person", "forever", 
            "i love you", "my safe place", "thinking of you"
        ];

        // Ganti URL foto di bawah dengan link foto Anda atau nama file foto lokal (contoh: 'foto1.jpg')
        const photos = [
            "bedua3.jpg",
            "bedua2.jpg",
            "bedua1.jpg"
        ];

        const mainScreen = document.getElementById('main-screen');
        const loadingScreen = document.getElementById('loading-screen');
        const bgMusic = document.getElementById('bg-music');
        const musicIcon = document.getElementById('music-icon');

        // Simulasi waktu loading 3 detik sebelum masuk ke halaman kenangan
        setTimeout(() => {
            loadingScreen.style.opacity = '0';
            setTimeout(() => {
                loadingScreen.style.display = 'none';
                mainScreen.style.display = 'block';
                setTimeout(() => { mainScreen.style.opacity = '1'; }, 50);
                
                // Mulai putar musik otomatis (beberapa browser memerlukan interaksi klik tombol)
                bgMusic.play().catch(() => {});
                
                // Mulai memunculkan elemen melayang secara berkala
                startFloatingElements();
            }, 1000);
        }, 3000);

        function createFloatingText() {
            const el = document.createElement('div');
            el.classList.add('floating-item');
            el.innerText = texts[Math.floor(Math.random() * texts.length)];
            el.style.left = Math.random() * 80 + 'vw';
            el.style.animationDuration = (Math.random() * 5 + 7) + 's'; // Durasi 7-12 detik
            mainScreen.appendChild(el);

            setTimeout(() => { el.remove(); }, 12000);
        }

        function createFloatingPhoto() {
            const img = document.createElement('img');
            img.classList.add('photo-card');
            img.src = photos[Math.floor(Math.random() * photos.length)];
            img.style.left = Math.random() * 75 + 'vw';
            img.style.animationDuration = (Math.random() * 6 + 9) + 's';
            mainScreen.appendChild(img);

            setTimeout(() => { img.remove(); }, 14000);
        }

        function startFloatingElements() {
            setInterval(createFloatingText, 800);
            setInterval(createFloatingPhoto, 2500);
        }

        // Fungsi kontrol tombol musik
        let isPlaying = true;
        function toggleMusic() {
            if (isPlaying) {
                bgMusic.pause();
                musicIcon.style.opacity = '0.4';
                isPlaying = false;
            } else {
                bgMusic.play();
                musicIcon.style.opacity = '1';
                isPlaying = true;
            }
        }
    </script>
</body>
</html>
